[project]
name = "freaky"
version = "0.1.0"
description = "Cursed emoji classifier — Thai/English multilabel, Stupid Hackathon X 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "anthropic>=0.30",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "trl>=0.9",
    "peft>=0.11",
    "accelerate>=0.30",
    "datasets>=2.20",
    "requests>=2.31",
    "optimum[exporters]>=1.20,<2.0",
    "onnxruntime>=1.31.0",
    "onnx>=1.23.2",
    "fastapi>=0.136.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]
serve = ["vllm>=0.4"]
