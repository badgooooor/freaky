<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>freaky 👻 cursed emoji labeler</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    h1 { font-size: 2rem; letter-spacing: -0.02em; }
    h1 span { opacity: 0.5; font-weight: 400; font-size: 1rem; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; }

    select, textarea {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #f0f0f0;
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      width: 100%;
      resize: none;
    }

    select:focus, textarea:focus { outline: 2px solid #7c3aed; border-color: transparent; }

    button {
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) { background: #6d28d9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #output {
      font-size: 3rem;
      text-align: center;
      min-height: 3.5rem;
      letter-spacing: 0.1em;
    }

    #status {
      font-size: 0.78rem;
      opacity: 0.45;
      text-align: center;
      min-height: 1.1em;
    }

    .row { display: flex; gap: 0.75rem; align-items: flex-end; }
    .row select { flex: 1; }
  </style>
</head>
<body>
  <h1>freaky <span>cursed emoji labeler · runs in browser</span></h1>

  <div class="card">
    <div>
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="freaky">freaky</option>
        <option value="passive_aggressive">passive_aggressive</option>
        <option value="wrong_occasion">wrong_occasion</option>
        <option value="unhinged">unhinged</option>
      </select>
    </div>

    <div>
      <label for="message">Message</label>
      <textarea id="message" rows="3" placeholder="กินข้าวกันมั้ยเย็นนี้"></textarea>
    </div>

    <button id="submit">Curse it →</button>

    <div id="output"></div>
    <div id="status">Model loads on first run (~750 MB, cached after).</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
